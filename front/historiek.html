        <article class="c-history-select">
            <section class="c-history__date-picker">
            <h2>Kies een tijdsperiode</h2>

                <div class="c-date-picker__input">
                    <label class="o-input-reset c-input-group" for="startdatum">
                        <input class="c-input-group__field js-start-date" type="date" id="startdatum" name="startdatum" required>
                    </label>
                    <label class="o-input-reset c-input-group" for="einddatum">
                        <input class="c-input-group__field js-end-date" type="date" id="einddatum" name="einddatum" required>
                    </label>
                </div>

                <button class="o-button-reset o-button o-button--light c-date-picker__button js-select-date-button">
                    <svg class="o-button__icon o-button__icon--light" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">

                    <p class="o-button__text o-button__text--light">Selecteer datums</p>
                </button>

            </section>
            <section class="c-history__keg-picker">
                <h2>Kies een vat</h2>

                <div class="c-kegs">

                    <select class="c-keg__select js-select-keg" id="select-keg" required>
                        <option value="">— Selecteer een vat —</option>
                    </select>
                
                </div>

                <button class="o-button-reset o-button c-date-picker__button js-select-keg-button">
